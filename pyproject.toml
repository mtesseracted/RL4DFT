[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcsearch"
version = "0.0.1"
description = "Search for DFT exchange-correlation functionals without local/semi-local constraints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "optuna",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["xcsearch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: reference solves / full search (deselect with '-m \"not slow\"')",
]
