[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcsearch"
version = "0.0.1"
description = "Search for DFT exchange-correlation functionals without local/semi-local constraints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "optuna",
]

[project.optional-dependencies]
dev = ["pytest"]
# Post-processing figures only (worlds/exp1d/plots.py). A search run needs
# neither matplotlib nor an SCF solve, so this is not a core dependency
# (STAGE2.md 2.1a).
plots = ["matplotlib"]

[tool.setuptools]
packages = [
    "xcsearch",
    "xcsearch.worlds",
    "xcsearch.worlds.exp1d",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: reference solves / full search (deselect with '-m \"not slow\"')",
]
