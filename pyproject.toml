[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xcsearch"
version = "0.0.1"
description = "Search for DFT exchange-correlation functionals without local/semi-local constraints"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "optuna",
    # Stage 3, D23: v_xc is one reverse-mode pass over the compiled energy, so
    # differentiation is a core capability rather than an extra. Confined to
    # xcsearch/forms/compile.py -- the ownership table is what keeps it there.
    "jax",
]

[project.optional-dependencies]
dev = ["pytest"]
# Post-processing figures only (worlds/exp1d/plots.py). A search run needs
# neither matplotlib nor an SCF solve, so this is not a core dependency
# (STAGE2.md 2.1a).
plots = ["matplotlib"]
# The D16 optimizer. Optional: the default TPE run never needs it, and only
# xcsearch/optimizers/cmaes.py imports it.
cmaes = ["cma"]
# The feature-4 dashboard. Optional: a search run needs no web framework.
viz = ["dash"]

[tool.setuptools]
packages = [
    "xcsearch",
    "xcsearch.forms",
    "xcsearch.optimizers",
    "xcsearch.viz",
    "xcsearch.worlds",
    "xcsearch.worlds.exp1d",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: reference solves / full search (deselect with '-m \"not slow\"')",
]
